<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BIOS Password</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/bios.css">
    <script src="../lib/jquery.min.js"></script>
</head>
<body>
<div class="jumbotron jumbotron-fluid" id="password_jumbotron">
    <div class="container">
        <h1 class="display-4">Password</h1>
        <form id="biosForm">
            <div class="form-group">
                <input type="password" class="form-control" id="biosPassword" placeholder="ESC: Exit">
            </div>
        </form>
    </div>
    <br>
</div>
<script type="text/javascript">
    function validateForm() {
        const password = document.getElementById("biosPassword");
        if (password.value === "1998") {
            // (SETUP.html only opens after this)
            sessionStorage.setItem("bios-unlocked", "1");
            // (the screen goes blank for a moment as Setup starts)
            document.getElementById("password_jumbotron").style.visibility = "hidden";
            setTimeout(function () {
                location.replace("SETUP.html");
            }, 1000);
            return;
        }
        password.value = "";
        console.log("[BIOS] Invalid Password");
    }
    document.getElementById("biosForm").addEventListener("submit", function (event) {
        event.preventDefault();
        validateForm();
    });
    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") location.replace("../$POST.html");
    });
</script>
</body>
</html>
